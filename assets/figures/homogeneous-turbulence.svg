<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Homogeneous compressible turbulence in a periodic domain</title>
  <desc id="desc">A schematic slice through a periodic volume. Vortical and expanding or compressing motions occupy the domain; there is no wall or imposed mean shear. This is not a DNS field.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#713e58" stroke-width="1.3"/></marker><g id="eddy" fill="none" stroke="#713e58" stroke-width="2.5"><path d="M-22 8 C-36-23 22-37 25-4 C27 18-8 27-15 9" marker-end="url(#arrow)"/></g><g id="expansion" stroke="#48424d" stroke-width="2" marker-end="url(#arrow)"><path d="M-6-6-20-20 M6-6 20-20 M6 6 20 20 M-6 6-20 20"/></g></defs>
  <rect width="600" height="300" rx="8" fill="#f0eaee"/>
  <g fill="none" stroke="#857882" stroke-width="1.5" stroke-dasharray="6 6"><rect x="36" y="27" width="318" height="246"/><path d="M36 109H354 M36 191H354 M142 27V273 M248 27V273" opacity=".35"/></g>
  <g><use href="#eddy" x="85" y="74"/><use href="#eddy" x="296" y="153" transform="rotate(80 296 153)"/><use href="#eddy" x="191" y="232" transform="rotate(180 191 232)"/><use href="#eddy" x="193" y="74" transform="rotate(45 193 74)"/><use href="#eddy" x="87" y="231"/><use href="#eddy" x="302" y="232" transform="rotate(-60 302 232)"/><use href="#expansion" x="300" y="73"/><use href="#expansion" x="192" y="150"/><use href="#expansion" x="85" y="150"/></g>
  <g font-family="Arial,sans-serif" fill="#2a252f"><text x="386" y="72" font-size="25">Periodic</text><text x="386" y="104" font-size="25">volume</text><text x="386" y="165" font-size="23">Vortical +</text><text x="386" y="196" font-size="23">dilatational</text><text x="386" y="227" font-size="23">motions</text></g>
</svg>
